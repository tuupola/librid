site_name: ASTM F3411 Remote ID
site_description: ASTM F3411 and DIN EN 4709-002 Remote ID library written in C programming language.
site_url: https://www.librid.org/latest/
repo_url: https://github.com/tuupola/librid
edit_uri: ""
theme:
  name: readthedocs
  custom_dir: scripts/overrides
plugins:
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Docs:
          - index.md: Project overview
        API:
          - api/*.md
nav:
  - Home: index.md
  - API:
      - Basic ID: api/basic_id.md
      - Location: api/location.md
      - Auth: api/auth.md
      - Auth page: api/auth_page.md
      - Self ID: api/self_id.md
      - System: api/system.md
      - Operator ID: api/operator_id.md
      - Message pack: api/message_pack.md
      - Message: api/message.md
      - Transport: api/transport.md
      - Version: api/version.md
exclude_docs: |
  /xml/
  /tmp/
