on: [push]
jobs:
  test:
    runs-on: docker
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y gcc make cmake
      - name: Configure
        run: cmake -B build -DRID_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ctest --output-on-failure --verbose
  test-with-libdrip:
    runs-on: docker
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v4
        with:
          path: librid
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y gcc make cmake git
      - name: Checkout libdrip
        run: git clone --depth 1 https://github.com/tuupola/libdrip.git libdrip
      - name: Configure
        working-directory: librid
        run: cmake -B build -DRID_BUILD_TESTS=ON
      - name: Build
        working-directory: librid
        run: cmake --build build
      - name: Test
        working-directory: librid
        run: cd build && ctest --output-on-failure --verbose
